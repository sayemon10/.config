# vim: ft=tmux
# Clean minimal status bar – Gruvbox Dark colors

set -g status on
set -g status-interval 1
set -g status-justify centre
set -g status-position top

# Gruvbox Dark palette
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-bg "#282828"

set -g status-left-length 50
set -g status-right-length 50

# Left – session name
set -g status-left "#[fg=#fabd2f,bold] #S "

# Right – date + time + hostname
set -g status-right "#[fg=#928374]%I:%M %p  #[fg=#83a598]#h "

# Window list
setw -g window-status-separator "  "
setw -g window-status-style "fg=#928374,bg=#282828"
setw -g window-status-format " #I: #W "

setw -g window-status-current-style "fg=#282828,bg=#fabd2f,bold"
setw -g window-status-current-format " #I: #W "

# Extra Gruvbox touches
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "fg=#282828,bg=#fabd2f"
set -g mode-style "fg=#282828,bg=#fabd2f"
